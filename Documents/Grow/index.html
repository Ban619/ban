<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grow — Farm Game</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="src/style.css">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Grow</a>
      <div class="d-flex align-items-center">
        <div class="me-3 text-white">Coins: <span id="coins">0</span></div>
        <div class="me-3 text-white">Level: <span id="level">1</span></div>
        <button id="saveRemote" class="btn btn-outline-light btn-sm me-2">Save (Server)</button>
        <button id="loadRemote" class="btn btn-outline-light btn-sm">Load (Server)</button>
      </div>
    </div>
  </nav>

  <main class="container my-4">
    <div class="row">
      <div class="col-lg-8">
        <div id="farm" class="farm-grid"></div>
      </div>
      <div class="col-lg-4">
        <div class="card mb-3">
          <div class="card-body">
            <h5 class="card-title">Shop</h5>
            <div class="d-grid gap-2">
              <button class="btn btn-primary" data-seed="wheat">Buy Wheat (10)</button>
              <button class="btn btn-secondary" data-seed="corn">Buy Corn (20)</button>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-body">
            <h5 class="card-title">Controls</h5>
            <button id="saveLocal" class="btn btn-outline-primary me-2">Save (Local)</button>
            <button id="loadLocal" class="btn btn-outline-secondary">Load (Local)</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="src/app.js"></script>
</body>
</html>
